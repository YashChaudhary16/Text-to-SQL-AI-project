# Curated semantic layer for the TPC-DS retail warehouse.
#
# This file is hand-written business knowledge. `sqlagent build-catalog` merges it with live
# introspection of the warehouse (types, sample values, date coverage) into
# semantic/tpcds.catalog.json, which is what the app loads at runtime.
#
# Column descriptions resolve in this order:
#   1. tables.<t>.columns.<col>              exact override
#   2. column_patterns (matched on the column name minus its table prefix)
#   3. auto-generated from `abbreviations` (e.g. "ext_sales_price" -> "extended sales price")

domain: >
  A national retailer that sells through three channels: physical stores, a mail-order
  catalog, and a website. The warehouse holds sales, returns and inventory facts plus
  customer, product, time and location dimensions.

# Expansion of abbreviation tokens used in column names.
abbreviations:
  sk: surrogate key (join key)
  id: business identifier
  ext: extended (unit value x quantity)
  amt: amount
  inc: including
  cdemo: customer demographics
  hdemo: household demographics
  addr: address
  demo: demographics
  moy: month of year (1-12)
  dom: day of month
  qoy: quarter of year (1-4)
  dow: day of week (0=Sunday)
  seq: sequence number
  fy: fiscal year
  ly: last year
  lq: last quarter
  sq: square
  ft: feet
  mkt: market
  rec: record
  gmt: GMT
  promo: promotion
  cust: customer
  dep: dependents
  num: number
  desc: description
  manufact: manufacturer
  cc: call center
  sm: ship mode
  wp: web page
  mgr: manager

# Columns ending with these suffixes are foreign keys to the given dimension primary key.
# The builder derives join paths from this, since TPC-DS declares no FK constraints.
# Longest suffix wins (e.g. "ship_mode_sk" before "mode_sk").
dimension_keys:
  date_sk: date_dim.d_date_sk
  time_sk: time_dim.t_time_sk
  item_sk: item.i_item_sk
  customer_sk: customer.c_customer_sk
  cdemo_sk: customer_demographics.cd_demo_sk
  hdemo_sk: household_demographics.hd_demo_sk
  addr_sk: customer_address.ca_address_sk
  store_sk: store.s_store_sk
  promo_sk: promotion.p_promo_sk
  warehouse_sk: warehouse.w_warehouse_sk
  ship_mode_sk: ship_mode.sm_ship_mode_sk
  call_center_sk: call_center.cc_call_center_sk
  catalog_page_sk: catalog_page.cp_catalog_page_sk
  web_page_sk: web_page.wp_web_page_sk
  web_site_sk: web_site.web_site_sk
  reason_sk: reason.r_reason_sk
  income_band_sk: income_band.ib_income_band_sk

# Shared semantics for the sales and returns fact columns across all three channels.
column_patterns:
  quantity: Number of units sold on this line item.
  wholesale_cost: Unit cost the retailer paid for the item.
  list_price: Unit list (sticker) price before any discount.
  sales_price: Unit price actually charged after discount.
  ext_discount_amt: Total discount on the line = (list_price - sales_price) x quantity.
  ext_sales_price: Gross sales amount for the line = sales_price x quantity. "Gross sales".
  ext_wholesale_cost: Total cost of goods for the line = wholesale_cost x quantity.
  ext_list_price: List price x quantity.
  ext_tax: Sales tax charged on the line.
  coupon_amt: Coupon discount applied to the line.
  ext_ship_cost: Shipping cost charged for the line.
  net_paid: Net revenue = ext_sales_price - coupon_amt. Use for "revenue" / "net sales".
  net_paid_inc_tax: Net revenue including tax.
  net_paid_inc_ship: Net revenue including shipping.
  net_paid_inc_ship_tax: Net revenue including shipping and tax.
  net_profit: Profit = net_paid - ext_wholesale_cost. Use for "profit" / "margin".
  ticket_number: Store receipt number; groups line items bought in one store visit.
  order_number: Order number; groups line items in one catalog or web order.
  return_quantity: Number of units returned.
  return_amt: Refund amount before tax.
  return_amount: Refund amount before tax.
  return_tax: Tax refunded.
  return_amt_inc_tax: Refund amount including tax.
  fee: Restocking/return fee charged to the customer.
  return_ship_cost: Shipping cost of the return.
  refunded_cash: Portion refunded as cash.
  reversed_charge: Portion refunded by reversing a card charge.
  store_credit: Portion refunded as store credit.
  account_credit: Portion refunded as web account credit.
  net_loss: Net loss to the retailer from the return.
  rec_start_date: Start of validity for this version of the record (slowly changing dimension).
  rec_end_date: End of validity for this version of the record; NULL means current.
  # Address fields shared by customer_address, store, warehouse, call_center, web_site.
  street_number: Street number of the address (text).
  street_name: Street name.
  street_type: Street type, e.g. 'Avenue', 'Drive' (spelling is not standardised, e.g. 'Ave' vs 'Avenue').
  suite_number: Suite or unit, e.g. 'Suite 100'.
  city: City name.
  county: County name, e.g. 'Williamson County'.
  state: Two-letter US state code, e.g. 'TN'.
  zip: 5-digit ZIP code (stored as text).
  country: Country name; always 'United States' in this data.
  gmt_offset: Time-zone offset from GMT in hours (-10 to -5).
  tax_percentage: Sales tax rate as a fraction (0.01-0.11).
  # Organisation fields shared by store, call_center, web_site.
  hours: Opening hours, e.g. '8AM-4PM'.
  manager: Name of the location's manager (a person's name, not an ID). Product/merchandise managers are item.i_manager_id.
  market_manager: Name of the regional market manager.
  market_id: Numeric code of the market (region) the location belongs to.
  mkt_id: Numeric code of the market (region) the location belongs to.
  mkt_class: Market class (generated filler text; not meaningful).
  mkt_desc: Market description (generated filler text; not meaningful).
  market_desc: Market description (generated filler text; not meaningful).
  division: Numeric division code.
  division_id: Numeric division code.
  division_name: Division name (mostly placeholder values).
  company: Numeric company code.
  company_id: Numeric company code.
  company_name: Company name (mostly placeholder values).
  name: Display name.
  class: Size class, e.g. 'small', 'medium', 'large'.

tables:
  store_sales:
    kind: fact
    business_name: Store sales
    description: One row per item on an in-store purchase receipt. The largest fact table.
    synonyms: [in-store sales, retail sales, POS transactions, receipts, physical store revenue]
  catalog_sales:
    kind: fact
    business_name: Catalog sales
    description: One row per item on a mail/phone catalog order.
    synonyms: [catalog orders, mail order sales, phone orders]
  web_sales:
    kind: fact
    business_name: Web sales
    description: One row per item on an online order.
    synonyms: [online sales, e-commerce orders, website sales, internet sales]
  store_returns:
    kind: fact
    business_name: Store returns
    description: One row per item returned to a physical store.
    synonyms: [in-store returns, refunds]
  catalog_returns:
    kind: fact
    business_name: Catalog returns
    description: One row per item returned from a catalog order.
    synonyms: [catalog refunds]
  web_returns:
    kind: fact
    business_name: Web returns
    description: One row per item returned from a web order.
    synonyms: [online returns, web refunds]
  inventory:
    kind: fact
    business_name: Inventory snapshots
    description: Weekly quantity on hand for each item in each warehouse.
    synonyms: [stock, stock levels, on-hand inventory]
    columns:
      inv_quantity_on_hand: Units in stock at the warehouse on that snapshot date.

  date_dim:
    kind: dimension
    business_name: Calendar
    description: One row per calendar day. Join any *_date_sk column here to filter or group by year, quarter, month, weekday or holiday.
    synonyms: [date, day, month, year, quarter, week, calendar, when, holiday, weekend]
    columns:
      d_date: The calendar date.
      d_year: Calendar year, e.g. 2001.
      d_moy: Month number 1-12.
      d_qoy: Quarter number 1-4.
      d_dom: Day of month 1-31.
      d_dow: Day of week number, 0=Sunday ... 6=Saturday.
      d_day_name: Weekday name, e.g. 'Monday'.
      d_month_seq: Running month counter; use for month ranges spanning years.
      d_week_seq: Running week counter.
      d_holiday: "'Y' if the day is a holiday."
      d_weekend: "'Y' if Saturday or Sunday."
      d_date_id: "Business key, 16-char code (e.g. 'AAAAAAAANHLGFCAA')."
      d_quarter_seq: "Running quarter counter; use for quarter ranges spanning years."
      d_quarter_name: "Quarter label, e.g. '2002Q1'."
      d_fy_year: "Fiscal year; same as the calendar year in this data."
      d_fy_quarter_seq: "Running fiscal-quarter counter."
      d_fy_week_seq: "Running fiscal-week counter."
      d_following_holiday: "'Y' if the day after a holiday."
      d_first_dom: "d_date_sk of the first day of this month (a date key, not a date)."
      d_last_dom: "d_date_sk of the last day of this month (a date key, not a date)."
      d_same_day_ly: "d_date_sk of the same day last year; use for year-over-year comparisons."
      d_same_day_lq: "d_date_sk of the same day last quarter."
      d_current_day: "Benchmark 'today' flags (Y/N). Ignore: relative dates are anchored to the data coverage."
      d_current_week: "Benchmark flag; ignore (see d_current_day)."
      d_current_month: "Benchmark flag; ignore (see d_current_day)."
      d_current_quarter: "Benchmark flag; ignore (see d_current_day)."
      d_current_year: "Benchmark flag; ignore (see d_current_day)."
  time_dim:
    kind: dimension
    business_name: Time of day
    description: One row per second of the day. Join *_time_sk here for hour or shift analysis.
    synonyms: [hour, time of day, shift, morning, evening, meal time, breakfast, lunch, dinner]
    columns:
      t_hour: Hour of day 0-23.
      t_shift: Work shift name, e.g. 'first', 'second', 'third'.
      t_meal_time: Meal period ('breakfast', 'lunch', 'dinner') or NULL.
      t_time_id: "Business key, 16-char code."
      t_time: "Seconds since midnight (0-86399); equal to t_time_sk."
      t_minute: "Minute 0-59."
      t_second: "Second 0-59."
      t_am_pm: "'AM' or 'PM'."
      t_sub_shift: "Part of day: 'morning', 'afternoon', 'evening' or 'night'."
  item:
    kind: dimension
    business_name: Products
    description: Product catalog with category, class, brand and price. Several versions per product may exist (rec_start_date/rec_end_date).
    synonyms: [product, products, SKU, merchandise, goods, brand, category, department]
    columns:
      i_item_id: Product business code; stable across record versions. Use it to count distinct products.
      i_category: Top-level product category, e.g. 'Books', 'Electronics', 'Women'.
      i_class: Sub-category within a category.
      i_brand: Brand name.
      i_product_name: Product name.
      i_current_price: Current unit price.
      i_manufact_id: Manufacturer number.
      i_item_desc: "Free-text product description (generated filler text)."
      i_wholesale_cost: "Unit cost to the retailer (0.02-87.36)."
      i_brand_id: "Numeric brand code; pairs with i_brand."
      i_class_id: "Numeric sub-category code; pairs with i_class."
      i_category_id: "Numeric category code; pairs with i_category."
      i_manufact: "Manufacturer name (generated pseudo-word)."
      i_size: "Size, e.g. 'small', 'medium', 'large', 'petite', 'N/A'."
      i_formulation: "Product formulation code (generated)."
      i_color: "Color, e.g. 'slate', 'turquoise'."
      i_units: "Unit of measure, e.g. 'Each', 'Pound', 'Carton'."
      i_container: "Container type (always 'Unknown' in this data)."
      i_manager_id: "Numeric ID of the merchandise manager responsible for the item. 'Items managed by manager N' or 'manager N's products' means i_manager_id = N."
  customer:
    kind: dimension
    business_name: Customers
    description: One row per customer, with name, email, birth date and links to their current address and demographics.
    synonyms: [customers, shoppers, buyers, clients, people, users, preferred customers, loyalty members]
    columns:
      c_customer_id: Customer business code.
      c_current_addr_sk: Customer's current address (join customer_address).
      c_current_cdemo_sk: Customer's current demographic profile (join customer_demographics).
      c_current_hdemo_sk: Customer's current household profile (join household_demographics).
      c_preferred_cust_flag: "'Y' if a preferred (loyalty) customer. This is THE column for 'preferred customers'."
      c_birth_country: Country of birth.
      c_salutation: "Title, e.g. 'Mr.', 'Ms.', 'Dr.'."
      c_first_name: "First name."
      c_last_name: "Last name."
      c_birth_day: "Day of month of birth (1-31)."
      c_birth_month: "Month of birth (1-12)."
      c_birth_year: "Year of birth; use to compute age."
      c_login: "Website login name (mostly NULL)."
      c_email_address: "Email address."
      c_first_sales_date_sk: "Date of the customer's first purchase (join date_dim)."
      c_first_shipto_date_sk: "Date of the customer's first shipment (join date_dim)."
      c_last_review_date_sk: "Date the customer last wrote a review (join date_dim)."
  customer_address:
    kind: dimension
    business_name: Addresses
    description: Postal addresses of customers, used for geography (state, county, city, zip).
    synonyms: [location, geography, state, city, county, zip code, region, where]
    columns:
      ca_state: Two-letter US state code, e.g. 'CA', 'TX'.
      ca_address_id: "Business key, 16-char code."
      ca_location_type: "Dwelling type: 'single family', 'condo' or 'apartment'."
  customer_demographics:
    kind: dimension
    business_name: Customer demographics
    description: Demographic profile (gender, marital status, education, credit rating, dependents).
    synonyms: [gender, marital status, education, credit rating, demographic segment, married, single]
    columns:
      cd_gender: "'M' or 'F'."
      cd_marital_status: "'M' married, 'S' single, 'D' divorced, 'W' widowed, 'U' unknown."
      cd_education_status: Highest education level, e.g. 'College', 'Advanced Degree'.
      cd_purchase_estimate: "Estimated purchase capacity in dollars (500-10000)."
      cd_credit_rating: "Credit rating: 'Good', 'High Risk', 'Low Risk' or 'Unknown'."
      cd_dep_count: "Number of dependents (0-6)."
      cd_dep_employed_count: "Number of employed dependents (0-6)."
      cd_dep_college_count: "Number of dependents in college (0-6)."
  household_demographics:
    kind: dimension
    business_name: Household demographics
    description: Household profile (income band, buying potential, dependents, vehicles).
    synonyms: [household, income, buying potential, vehicles, family size]
    columns:
      hd_buy_potential: Estimated spending potential band, e.g. '>10000', '0-500'.
      hd_income_band_sk: "Household income range (join income_band)."
      hd_dep_count: "Number of dependents in the household."
      hd_vehicle_count: "Number of vehicles; -1 means unknown."
  income_band:
    kind: dimension
    business_name: Income bands
    description: Annual income ranges referenced by household demographics.
    synonyms: [income, salary range, earnings]
    columns:
      ib_lower_bound: "Lower bound of annual income in dollars, e.g. 10001."
      ib_upper_bound: "Upper bound of annual income in dollars, e.g. 20000."
  store:
    kind: dimension
    business_name: Stores
    description: Physical store locations with manager, size and market.
    synonyms: [shop, branch, outlet, location, store manager]
    columns:
      s_store_name: "Store name (generated pseudo-word, e.g. 'ought')."
      s_number_employees: "Number of employees."
      s_floor_space: "Floor space in square feet."
      s_closed_date_sk: "Date the store closed, NULL if open (join date_dim)."
      s_geography_class: "Geography class (always 'Unknown')."
  warehouse:
    kind: dimension
    business_name: Warehouses
    description: Distribution warehouses that ship catalog and web orders and hold inventory.
    synonyms: [distribution center, DC, fulfillment center]
    columns:
      w_warehouse_name: "Warehouse name (generated filler text)."
      w_warehouse_sq_ft: "Warehouse size in square feet."
  promotion:
    kind: dimension
    business_name: Promotions
    description: Marketing promotions and the channels they ran on (email, TV, radio, ...).
    synonyms: [promo, campaign, marketing, discount, advertising]
    columns:
      p_channel_email: "'Y' if the promotion ran by email."
      p_channel_tv: "'Y' if the promotion ran on TV."
      p_promo_name: "Promotion name (generated pseudo-word)."
      p_item_sk: "The item being promoted (join item)."
      p_start_date_sk: "Promotion start date (join date_dim)."
      p_end_date_sk: "Promotion end date (join date_dim)."
      p_cost: "Promotion cost (a constant 1000.00 in this data)."
      p_response_target: "Response target (always 1)."
      p_channel_dmail: "'Y' if the promotion ran by direct mail."
      p_channel_catalog: "'Y' if the promotion ran in the catalog."
      p_channel_radio: "'Y' if the promotion ran on radio."
      p_channel_press: "'Y' if the promotion ran in the press."
      p_channel_event: "'Y' if the promotion ran at events."
      p_channel_demo: "'Y' if the promotion used in-store demos."
      p_channel_details: "Free-text channel notes (generated filler text)."
      p_purpose: "Purpose (always 'Unknown')."
      p_discount_active: "'Y' if a discount is active."
  reason:
    kind: dimension
    business_name: Return reasons
    description: Why a customer returned an item.
    synonyms: [return reason, why returned, complaint]
    columns:
      r_reason_desc: "Reason text, e.g. 'Package was damaged', 'Stopped working'. Note the data's own spelling: 'Not the product that was ordred'."
  ship_mode:
    kind: dimension
    business_name: Shipping methods
    description: Shipping method and carrier for catalog and web orders.
    synonyms: [shipping, carrier, delivery method, express, overnight]
    columns:
      sm_type: "Speed: 'REGULAR', 'EXPRESS', 'OVERNIGHT', 'NEXT DAY', 'TWO DAY', 'LIBRARY'."
      sm_code: "Transport: 'AIR', 'SURFACE', 'SEA', 'BIKE'."
      sm_carrier: "Carrier name, e.g. 'UPS', 'FEDEX'."
      sm_contract: "Contract code (generated)."
  call_center:
    kind: dimension
    business_name: Call centers
    description: Call centers that take catalog orders.
    synonyms: [phone center, customer service center]
    columns:
      cc_name: "Call center name, e.g. 'NY Metro', 'Mid Atlantic'."
      cc_employees: "Number of employees."
      cc_sq_ft: "Floor space in square feet."
      cc_open_date_sk: "Date the call center opened (join date_dim)."
      cc_closed_date_sk: "Date it closed, NULL if open (join date_dim)."
  catalog_page:
    kind: dimension
    business_name: Catalog pages
    description: Pages of the printed catalogs that items were ordered from.
    synonyms: [catalog, catalogue page]
    columns:
      cp_start_date_sk: "First date the catalog page was in circulation (join date_dim)."
      cp_end_date_sk: "Last date the catalog page was in circulation (join date_dim)."
      cp_department: "Department (always 'DEPARTMENT')."
      cp_catalog_number: "Catalog edition number."
      cp_catalog_page_number: "Page number within the catalog."
      cp_description: "Page description (generated filler text)."
      cp_type: "Catalog frequency: 'monthly', 'quarterly' or 'bi-annual'."
  web_page:
    kind: dimension
    business_name: Web pages
    description: Pages of the website that orders were placed from.
    synonyms: [page, url, site page]
    columns:
      wp_creation_date_sk: "Date the page was created (join date_dim)."
      wp_access_date_sk: "Date the page was last accessed (join date_dim)."
      wp_autogen_flag: "'Y' if the page was auto-generated."
      wp_customer_sk: "Customer the page belongs to, for personalised pages (join customer)."
      wp_url: "Page URL (placeholder)."
      wp_type: "Page type, e.g. 'welcome', 'general', 'protected', 'order'."
      wp_char_count: "Characters on the page."
      wp_link_count: "Links on the page."
      wp_image_count: "Images on the page."
      wp_max_ad_count: "Maximum ads shown on the page."
  web_site:
    kind: dimension
    business_name: Web sites
    description: The retailer's web sites.
    synonyms: [site, website]
    columns:
      web_name: "Site name, e.g. 'site_0'."
      web_open_date_sk: "Date the site opened (join date_dim)."
      web_close_date_sk: "Date the site closed, NULL if open (join date_dim)."

# Named business metrics. {p} is the fact-table column prefix (ss, cs, ws).
metrics:
  revenue: "SUM({p}_net_paid). Net sales after coupons, excluding tax and shipping."
  gross_sales: "SUM({p}_ext_sales_price). Before coupons."
  profit: "SUM({p}_net_profit)."
  units_sold: "SUM({p}_quantity)."
  orders: "COUNT(DISTINCT {p}_ticket_number) for store_sales; COUNT(DISTINCT {p}_order_number) for catalog/web."
  average_order_value: "revenue / orders."
  return_rate: "returned units / sold units for the same channel and period."
  return_amount: "SUM(sr_return_amt / cr_return_amount / wr_return_amt). Refund before tax; use the *_inc_tax column only if tax is asked for."

# Join and modelling rules the SQL writer must follow.
rules:
  - "Total sales across ALL channels: aggregate each sales table separately and combine with UNION ALL (or join pre-aggregated results). Never join store_sales, catalog_sales and web_sales directly."
  - "Link a return to its sale: store_returns ON (sr_item_sk = ss_item_sk AND sr_ticket_number = ss_ticket_number); catalog_returns ON (cr_item_sk = cs_item_sk AND cr_order_number = cs_order_number); web_returns ON (wr_item_sk = ws_item_sk AND wr_order_number = ws_order_number)."
  - "Filter or group by time by joining the fact's *_date_sk to date_dim.d_date_sk and using d_year / d_moy / d_qoy. Don't do date arithmetic on surrogate keys."
  - "Demographics at purchase time come from the fact row (ss_cdemo_sk, ss_hdemo_sk, ss_addr_sk); a customer's CURRENT profile comes from customer.c_current_*_sk."
  - "Catalog and web sales have separate bill_* (purchaser) and ship_* (recipient) customer keys; use bill_* for 'who bought'."
  - "Relative dates ('last year', 'this quarter', 'recently') are relative to the latest date in the data, not today's date. See data coverage."
  - "Some fact rows have NULL foreign keys; inner joins drop them, which is usually what's wanted."
  - "Item has multiple versions per product: count distinct i_item_id (not i_item_sk) for number of products."
  - "To rank or group by product, GROUP BY i_item_id only and display a name with ANY_VALUE(i_product_name). Never also group by i_product_name: names differ between versions, so one product would be split across several rows."
